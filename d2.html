<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>srj source · SRJ-SOURCE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <!-- ─── ANIMATED BG ─── -->
    <div class="bg-canvas">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <canvas id="particlesCanvas"></canvas>

    <!-- ─── AUTH OVERLAY ─── -->
    <div id="authOverlay" class="auth-overlay">
        <div id="authModal" class="auth-modal">
            <div class="auth-header">
                <h2>SRJ-SOURCE</h2>
                <p>Sign in to save your conversations</p>
            </div>
            <div class="auth-buttons">
                <button id="googleBtn" class="auth-btn google">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
                <button id="anonymousBtn" class="auth-btn anonymous">
                    <i class="fas fa-user-secret"></i> Continue as Guest
                </button>
            </div>
            <div class="auth-footer">
                <p>Your conversations are saved securely</p>
            </div>
        </div>
    </div>

    <!-- ─── APP ─── -->
    <div class="app">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <a href="#" class="logo" style="text-decoration:none;">
                    <img src="LOGO.png" alt="logo" style="height:34px;" />
                    <span class="logo-text">SRJ-SOURCE</span>
                </a>
                <div class="header-divider"></div>
                <div class="header-info">
                    <h2 id="conversationTitle">srj-source</h2>
                    <div class="status">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusLabel">online</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="header-btn" title="Theme"><i class="fas fa-moon"></i></button>
                <button id="deleteBtn" class="header-btn" title="Clear chat"><i class="fas fa-trash"></i></button>
                <div class="user-avatar-wrap" id="userMenuWrap">
                    <div class="user-avatar" id="userAvatar">
                        <span id="avatarText">👤</span>
                        <span class="status-ring" id="avatarRing"></span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-email" id="userEmailDisplay">Guest</div>
                        <button class="dropdown-item" id="dropdownProfile"><i class="fas fa-user"></i> Profile</button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="signOutBtn" style="color:#e0558a;"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Messages -->
        <div class="messages-area" id="messagesArea"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="msg-avatar-mini"><span>🌸</span></div>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quickReplies">
            <div class="chip" data-query="Tell me about your skills"><i class="fas fa-lightbulb"></i> Skills</div>
            <div class="chip" data-query="What projects have you built?"><i class="fas fa-rocket"></i> Projects</div>
            <div class="chip" data-query="How can I contact you?"><i class="fas fa-envelope"></i> Contact</div>
            <div class="chip" data-query="Tell me a joke"><i class="fas fa-laugh"></i> Joke</div>
            <div class="chip" data-query="Give me a quote"><i class="fas fa-quote-right"></i> Quote</div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrap" id="inputWrap">
                <div class="input-actions">
                    <button id="micBtn" class="input-btn" title="Voice input"><i class="fas fa-microphone"></i></button>
                    <button id="voiceBtn" class="input-btn" title="Speak response"><i class="fas fa-volume-up"></i></button>
                </div>
                <textarea id="chatInput" rows="1" placeholder="Type your message…"></textarea>
                <div class="input-right">
                    <button id="stopBtn" class="stop-btn" title="Stop"><i class="fas fa-stop"></i></button>
                    <button id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Confetti -->
    <canvas id="confettiCanvas"></canvas>

    <script src="script.js"></script>

</body>
</html>
